<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="reactimate — Hero Animator for React">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g font-family="Inter, -apple-system, system-ui, Segoe UI, Roboto, sans-serif" fill="#fafafa">
    <text x="80" y="120" font-size="22" font-weight="500" letter-spacing="2" fill="#a3a3a3">REACTIMATE</text>

    <text x="80" y="310" font-size="92" font-weight="800" letter-spacing="-2">
      Design <tspan fill="#38bdf8">animated</tspan>
    </text>
    <text x="80" y="420" font-size="92" font-weight="800" letter-spacing="-2">
      hero text.
    </text>

    <text x="80" y="500" font-size="28" font-weight="500" fill="#a3a3a3">
      Export clean React + Motion code.
    </text>

    <text x="80" y="555" font-size="20" font-weight="400" fill="#737373">
      Open-source · MIT · reactimate.top
    </text>
  </g>
</svg>
