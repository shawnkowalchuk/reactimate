name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Deploys Firestore rules AND Hosting on push to main, replacing Vercel's
  # git integration. Needs two repo settings (see README → Deployment):
  #   - variable VITE_FIREBASE_CONFIG — the public web-app config JSON
  #   - secret FIREBASE_SERVICE_ACCOUNT_REACTIMATE_CLOUD — deploy credentials
  #
  # Rules go out BEFORE hosting, deliberately. Rule changes are additive
  # (they grant the permissions new code needs), so old code under new rules
  # is harmless — whereas new code under OLD rules fails at runtime with
  # permission-denied errors that read like application bugs. Shipping the
  # bundle first would open exactly that window.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The hosting action below is hosting-only by design — it never reads
      # firebase.json's `firestore` block. Without this step a rules change
      # silently never ships. Runs before the build so a credentials problem
      # surfaces in seconds instead of after a full bundle.
      #
      # No --force: that flag lets index deletions through unprompted. Left
      # off, a pending deletion is reported rather than silently applied.
      #
      # firebase-tools is pinned: unpinned, every push executes whatever was
      # published most recently, in a shell holding a production key, and a
      # breaking major would take deploys down with no repo change. Bump this
      # by hand — Dependabot can't see it, since firebase-tools is deliberately
      # NOT a project dependency (it would slow `npm ci` in the verify job too,
      # which has no use for it). Note this pin covers THIS step only: the
      # hosting action below runs its own `firebase-tools@latest` internally.
      #
      # The key file is created by mktemp (mode 0600, unique name) and removed
      # by an EXIT trap rather than a trailing rm — a trailing rm is skipped
      # when the deploy fails, which is precisely when the key would be left
      # behind. The empty-secret guard turns a missing/emptied secret into one
      # readable line instead of a downstream firebase auth error; this repo
      # has already lost a day to that exact failure reading like a bug.
      - name: Deploy Firestore rules + indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REACTIMATE_CLOUD }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_REACTIMATE_CLOUD is unset or empty — set it with: gh secret set FIREBASE_SERVICE_ACCOUNT_REACTIMATE_CLOUD < key.json"
            exit 1
          fi

          SA_FILE="$(mktemp "$RUNNER_TEMP/firebase-sa.XXXXXX")"
          trap 'rm -f "$SA_FILE"' EXIT

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          npx --yes firebase-tools@15.27.0 deploy \
            --only firestore:rules,firestore:indexes \
            --project reactimate-cloud \
            --non-interactive

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REACTIMATE_CLOUD }}
          channelId: live
          projectId: reactimate-cloud
